name: Build Open Web Search

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "上游仓库 tag/branch"
        default: "v2.1.11"
        required: false
      force_build:
        description: "跳过 Dockerfile 差异检查"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "open-web-search/**"
      - ".github/workflows/build-open-web-search.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check upstream Dockerfile changes
        if: ${{ !inputs.force_build }}
        run: |
          UPSTREAM_URL="https://raw.githubusercontent.com/Aas-ee/open-webSearch/${{ inputs.version_tag || 'v2.1.11' }}/Dockerfile"
          curl -sL "$UPSTREAM_URL" -o /tmp/upstream.Dockerfile
          if ! diff ./open-web-search/Dockerfile /tmp/upstream.Dockerfile; then
            echo ""
            echo "::error::⚠️ 上游 Dockerfile 已变更，请检查并更新本地副本"
            exit 1
          fi
          echo "✅ Dockerfile 与上游一致"

      - name: Checkout upstream source
        uses: actions/checkout@v6
        with:
          repository: Aas-ee/open-webSearch
          ref: ${{ inputs.version_tag || 'v2.1.11' }}
          path: ./upstream-source

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/open-web-search
          tags: |
            type=raw,value=${{ inputs.version_tag || 'v2.1.11' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./upstream-source
          file: ./open-web-search/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
