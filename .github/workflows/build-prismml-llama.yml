name: Build PrismML llama

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Image tag"
        default: "latest"
        required: false
  push:
    branches: [main]
    paths:
      - "prism-ml/prismml-llama.dockerfile"
      - ".github/workflows/build-prismml-llama.yml"

jobs:
  build-and-push:
    # 显式固定: ubuntu-24.04 将于 2026-10/11 轮换到 26.04 (runner-images#14748)，
    # 镜像内容不受 runner 影响(FROM 已 pin)，锁 24.04 只为 CI 工具链可控
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/prismml-llama
          tags: |
            type=raw,value=${{ github.event.inputs.version_tag || 'latest' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./prism-ml
          file: ./prism-ml/prismml-llama.dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
