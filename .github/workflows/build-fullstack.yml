name: Build Fullstack Dev Image

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "设定镜像 Tag (例如: v1.0.0 或 latest)"
        required: false
        default: "latest"
        type: string
      image_name:
        description: "镜像名称 (例如: fullstack, dev, jdk11-dev)"
        required: false
        default: "fullstack"
        type: string
      build_args:
        description: "构建参数 (格式: MAVEN_VERSION=3.9.8;NODE_VERSION=20.18.1，不传则使用 Dockerfile 默认值)"
        required: false
        default: ""
        type: string

  push:
    branches:
      - main
    paths:
      - "fullstack-image/**"
      - ".github/workflows/build-fullstack.yml"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Parse build args
        id: parse-args
        run: |
          BUILD_ARGS=""
          if [[ -n "${{ inputs.build_args }}" ]]; then
            IFS=';' read -ra PAIRS <<< "${{ inputs.build_args }}"
            for pair in "${PAIRS[@]}"; do
              if [[ -n "$pair" && "$pair" == *"="* ]]; then
                BUILD_ARGS="${BUILD_ARGS}${pair}"$'\n'
              fi
            done
          fi
          echo "args<<EOF" >> $GITHUB_OUTPUT
          echo -n "$BUILD_ARGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event_name == 'workflow_dispatch' && inputs.image_name || 'fullstack' }}
          tags: |
            type=raw,value=${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./fullstack-image
          file: ./fullstack-image/fullstack.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          build-args: ${{ steps.parse-args.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max