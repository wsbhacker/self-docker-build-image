name: Check Fullstack Updates

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v6

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Get latest release timestamps
        id: releases
        run: |
          # 外部公开 repo 用 curl 无需认证
          # [诊断] 同时抓 HTTP 状态码与 body,便于判断是否被限流(null=限流或无 release)
          CLAUDE_HTTP=$(curl -sS -o /tmp/claude.json -w '%{http_code}' \
            https://api.github.com/repos/anthropics/claude-code/releases/latest)
          CLAUDE_TIME=$(jq -r '.published_at' /tmp/claude.json)
          CODEX_HTTP=$(curl -sS -o /tmp/codex.json -w '%{http_code}' \
            https://api.github.com/repos/openai/codex/releases/latest)
          CODEX_TIME=$(jq -r '.published_at' /tmp/codex.json)

          # ZCode 版本探测抽为独立脚本(.github/scripts/zcode-latest.sh),
          # 与 build-fullstack-batch.yml 共用同一实现。
          # 失败语义(fail-safe): 脚本永远 exit 0, 探测失败时 ZCODE_OK=0
          # 且 ZCODE_TS=0, 不参与下方 max 比较, 不影响 claude/codex 两路原有判定。
          eval "$(bash .github/scripts/zcode-latest.sh)"

          echo "::group::🔍 [诊断] 上游 release 探测"
          echo "claude-code: http=$CLAUDE_HTTP  published_at=[$CLAUDE_TIME]"
          echo "codex      : http=$CODEX_HTTP  published_at=[$CODEX_TIME]"
          echo "zcode      : ok=$ZCODE_OK ver=[$ZCODE_VER] releaseDate=[$ZCODE_RELEASE_DATE]"
          echo "claude body 前 200 字: $(head -c 200 /tmp/claude.json)"
          echo "codex  body 前 200 字: $(head -c 200 /tmp/codex.json)"
          echo "::endgroup::"

          CLAUDE_TS=$(date -d "$CLAUDE_TIME" +%s)
          CODEX_TS=$(date -d "$CODEX_TIME" +%s)

          # 三路上游取最新时间戳, 并记录胜者来源便于诊断
          LATEST_TS="$CLAUDE_TS"; LATEST_SRC="claude"
          if [ "$CODEX_TS" -gt "$LATEST_TS" ]; then LATEST_TS="$CODEX_TS"; LATEST_SRC="codex"; fi
          if [ "$ZCODE_TS" -gt "$LATEST_TS" ]; then LATEST_TS="$ZCODE_TS"; LATEST_SRC="zcode($ZCODE_VER)"; fi

          echo "latest_ts=$LATEST_TS" >> $GITHUB_OUTPUT
          echo "latest_src=$LATEST_SRC" >> $GITHUB_OUTPUT
          echo "[诊断] latest_ts=$LATEST_SRC($LATEST_TS) = $(date -d "@$LATEST_TS" '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null)"

      - name: Check if rebuild needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TS=${{ steps.releases.outputs.latest_ts }}
          OWNER=${{ github.repository_owner }}

          TAGS=$(yq '.scenarios.[].tag' fullstack-image/scenarios.yaml)
          if [ -z "$TAGS" ]; then
            echo "错误: scenarios.yaml 中没有找到任何 tag 或解析失败" >&2
            exit 1
          fi

          VERSIONS=$(gh api "/users/${OWNER}/packages/container/fullstack/versions" \
            --paginate 2>/tmp/ghcr-err.log | jq -s 'add' 2>/dev/null || echo "[]")
          if [ -s /tmp/ghcr-err.log ]; then
            echo "警告: GHCR API 查询出错:" >&2
            cat /tmp/ghcr-err.log >&2
          fi

          echo "::group::🔍 [诊断] 重建判定输入"
          LATEST_HUMAN=$(date -d "@$LATEST_TS" '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null \
            || echo "(LATEST_TS=[$LATEST_TS] 为空或非数字,解析失败)")
          echo "LATEST_TS(上游最新发布)=[$LATEST_TS] = $LATEST_HUMAN"
          echo "GHCR VERSIONS 条数=$(echo "$VERSIONS" | jq 'length' 2>/dev/null)"
          echo "scenarios TAGS=$(echo "$TAGS" | tr '\n' ' ')"
          echo "::endgroup::"

          for TAG in $TAGS; do
            TAG_TIME=$(echo "$VERSIONS" | \
              jq -r "[.[] | select(.metadata.container.tags[]? == \"$TAG\")] | first | .created_at // \"never\"")

            if [ "$TAG_TIME" = "never" ]; then
              echo "[诊断] tag=[$TAG] → 从未构建(应重建)"
              echo "need_rebuild=true" >> $GITHUB_OUTPUT
              echo "reason=$TAG 从未构建过" >> $GITHUB_OUTPUT
              exit 0
            fi

            TAG_TS=$(date -d "$TAG_TIME" +%s)
            TAG_HUMAN=$(date -d "@$TAG_TS" '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || echo "(解析失败)")
            if [ "$TAG_TS" -lt "$LATEST_TS" ]; then
              echo "[诊断] tag=[$TAG] created_at=$TAG_TIME($TAG_HUMAN) ts=$TAG_TS < latest_ts=$LATEST_TS → 旧,触发重建"
              echo "need_rebuild=true" >> $GITHUB_OUTPUT
              echo "reason=$TAG 版本过旧(构建于 $TAG_TIME)" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "[诊断] tag=[$TAG] created_at=$TAG_TIME($TAG_HUMAN) ts=$TAG_TS >= latest_ts=$LATEST_TS → 新,跳过"
            fi
          done

          echo "need_rebuild=false" >> $GITHUB_OUTPUT
          echo "[诊断] 所有 tag 均不旧于 latest_ts,判定无需重建"

      - name: Log result
        run: |
          if [ "${{ steps.check.outputs.need_rebuild }}" = "true" ]; then
            echo "🔨 需要重建: ${{ steps.check.outputs.reason }}"
          else
            echo "✅ 所有镜像均为最新，无需重建"
          fi

      - name: Trigger batch rebuild
        if: steps.check.outputs.need_rebuild == 'true'
        env:
          GH_TOKEN: ${{ secrets.REBUILD_PAT }}
        run: |
          echo "触发原因: ${{ steps.check.outputs.reason }}"
          gh workflow run build-fullstack-batch.yml --ref main
