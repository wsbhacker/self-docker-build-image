# Fullstack 镜像场景配置
# 每个场景定义独立的构建参数组合
# 新增场景只需添加新条目，无需修改 workflow

scenarios:
  android:
    description: "android开发环境"
    tag: android
    build_args:
      JDK_VERSION: 21

  web.24:
    description: "Node 24 开发环境"
    tag: web.24
    build_args:
      NODE_VERSION: 24.15.0

  yzj:
    description: "yzj开发环境"
    tag: yzj

  p:
    description: "personal开发环境"
    tag: p
    build_args:
      JDK_VERSION: 25

  yzj.web:
    description: "yzj.web开发环境"
    tag: yzj.web
    build_args:
      NODE_VERSION: 14.21.3
